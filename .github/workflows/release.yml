name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to upload the package to
        required: true
        type: string

permissions:
  contents: write

jobs:
  release_zip_file:
    name: Prepare release asset
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Package the integration directory for the release asset.
      - name: ZIP urbansolar_bv Dir
        run: |
          cd ${{ github.workspace }}/custom_components/ha_urbansolar_bv
          zip urbansolar_bv.zip -r ./
          ls
      - name: Upload zip to release
        uses: svenstaro/upload-release-action@v1-release
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ github.workspace }}/custom_components/ha_urbansolar_bv/urbansolar_bv.zip
          asset_name: urbansolar_bv.zip
          tag: ${{ github.event.release.tag_name || inputs.release_tag }}
          overwrite: true
